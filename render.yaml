databases:
  - name: eduup-db
    databaseName: eduup_db
    user: eduup_user
    plan: free
    region: frankfurt

services:
  # ── Django Backend ─────────────────────────────────────────────────────────
  - type: web
    name: eduup-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: eduup-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://eduup-app.onrender.com"
      - key: PYTHONIOENCODING
        value: "utf-8"

  # ── React Frontend (Static Site) ───────────────────────────────────────────
  - type: web
    name: eduup-app
    runtime: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://eduup-api.onrender.com/api/"
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
